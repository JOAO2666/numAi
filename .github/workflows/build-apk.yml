name: Build numAi APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test and build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK 25
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          chmod +x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-25" "build-tools;25.0.0"

      - name: Run tests and build debug APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dhttps.protocols=TLSv1.2
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*-debug.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" numAi-2.0-debug.apk
          sha256sum numAi-2.0-debug.apk > numAi-2.0-debug.apk.sha256
          ls -lh numAi-2.0-debug.apk numAi-2.0-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: numAi-2.0-apk
          path: |
            numAi-2.0-debug.apk
            numAi-2.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0-dev-{0}', github.run_number) }}
        run: |
          gh release create "$RELEASE_TAG" \
            numAi-2.0-debug.apk \
            numAi-2.0-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "numAi 2.0" \
            --notes "numAi 2.0: integração MCP configurável com OAuth ou credencial Bearer, ativação independente e execução automática opcional. APK de desenvolvimento assinado com a chave de depuração." \
            --prerelease
