name: Build numAi APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test and build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Android SDK 25
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_TEMP="$RUNNER_TEMP/android-sdk-25"
          mkdir -p "$SDK_TEMP/platform" "$SDK_TEMP/build-tools"
          curl -fsSL "https://dl.google.com/android/repository/platform-25_r03.zip" -o "$SDK_TEMP/platform-25.zip"
          curl -fsSL "https://dl.google.com/android/repository/build-tools_r25-linux.zip" -o "$SDK_TEMP/build-tools-25.zip"
          echo "00c2c5765e8988504be10a1eb66ed71fcdbd7fe8  $SDK_TEMP/platform-25.zip" | sha1sum --check
          echo "f2bbda60403e75cabd0f238598c3b4dfca56ea44  $SDK_TEMP/build-tools-25.zip" | sha1sum --check
          unzip -q "$SDK_TEMP/platform-25.zip" -d "$SDK_TEMP/platform"
          unzip -q "$SDK_TEMP/build-tools-25.zip" -d "$SDK_TEMP/build-tools"
          mkdir -p "$SDK_ROOT/platforms/android-25" "$SDK_ROOT/build-tools/25.0.0"
          cp -a "$SDK_TEMP/platform/android-7.1.1/." "$SDK_ROOT/platforms/android-25/"
          cp -a "$SDK_TEMP/build-tools/android-7.1.1/." "$SDK_ROOT/build-tools/25.0.0/"
          chmod -R a+rX "$SDK_ROOT/platforms/android-25" "$SDK_ROOT/build-tools/25.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Run tests and build debug APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dhttps.protocols=TLSv1.2
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*-debug.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" numAi-2.0-debug.apk
          sha256sum numAi-2.0-debug.apk > numAi-2.0-debug.apk.sha256
          ls -lh numAi-2.0-debug.apk numAi-2.0-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: numAi-2.0-apk
          path: |
            numAi-2.0-debug.apk
            numAi-2.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0-dev-{0}', github.run_number) }}
        run: |
          RELEASE_FLAGS=()
          case "$RELEASE_TAG" in
            *-dev.*|*-dev-*|*-alpha.*|*-beta.*|*-rc.*) RELEASE_FLAGS+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            numAi-2.0-debug.apk \
            numAi-2.0-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "numAi 2.0" \
            --notes "numAi 2.0: configurable MCP integration with OAuth or a Bearer credential, independent enable/disable control, and optional automatic tool execution. Development APK signed with the debug key." \
            "${RELEASE_FLAGS[@]}"
